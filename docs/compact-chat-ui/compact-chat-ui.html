/* ═══ tokens:root ═══ */
:root {
  --radius-xs: 6px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 22px;
  --radius-pill: 9999px;
  --font-sans: "SF Pro Text", "SF Pro Display", "SF Pro", -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif;
  --font-mono: "SF Mono", ui-monospace, Menlo, Monaco, Consolas, monospace;
  --sidebar-left-width: 250px;
  --sidebar-right-width: 340px;
  --workbench-width: 640px;
  --header-height: 52px;
  /*
   * 左右侧栏和整条顶栏共用同一套毛玻璃配方;内圆角是内容纸面顶角与玻璃壳之间的过渡半径,
   * 玻璃壳绕进这个圆角,顶栏与侧栏、内容区交界处才不会有硬直角。
   */
  --glass-blur: blur(16px) saturate(190%);
  --glass-fillet: 12px;
  --glass-edge-inset: 6px;
  --transition-smooth: 0.24s cubic-bezier(0.16, 1, 0.3, 1);
  --transition-enter: 0.18s cubic-bezier(0.16, 1, 0.3, 1);
  --motion-ease-enter: cubic-bezier(0.16, 1, 0.3, 1);
  --motion-ease-exit: cubic-bezier(0.4, 0, 1, 1);
  --transition-popover-exit: 110ms var(--motion-ease-exit);
  --transition-sidebar: 0.28s cubic-bezier(0.2, 0, 0, 1);
}


/* ═══ theme:daylight ═══ */
/* 晴空 Daylight(浅色基底) */
:root,
[data-scheme="light"] {
  color-scheme: light;
  --bg-sidebar-glass: rgba(238, 244, 252, 0.52);
  --bg-sidebar-hover: rgba(0, 0, 0, 0.04);
  --bg-sidebar-active: #ffffff;
  --bg-chat: #ffffff;
  --bg-chat-bubble-user: #edf4fc;
  --bg-card-surface: #ffffff;
  --bg-surface-subtle: #f7f7f8;
  --bg-elevated: #ffffff;
  --bg-code: #f5f5f6;
  --bg-hover: #f0f1f2;
  --scrollbar-thumb: rgba(0, 0, 0, 0.12);
  --border-subtle: rgba(25, 28, 33, 0.09);
  --border-strong: #d9dadd;
  --overlay: rgba(15, 23, 42, 0.18);
  --text-primary: #202124;
  --text-secondary: #484b50;
  --text-muted: #686d75;
  --text-dim: #a1a6ad;
  --accent-blue: #2563eb;
  --accent-blue-hover: #1d4ed8;
  --accent-contrast: #ffffff;
  --success: #059669;
  --danger: #c8322a;
  --warning: #ea580c;
  --violet: #7c3aed;
  --tint: 6%;
  --tint-strong: 12%;
  --avatar-from: #f97316;
  --avatar-to: #ec4899;
  --shadow-card: 0 1px 3px rgba(20, 20, 20, 0.035);
  --shadow-dock: 0 8px 24px rgba(20, 20, 20, 0.075), 0 1px 3px rgba(20, 20, 20, 0.035);
  --shadow-active-item: none;
  --shadow-popover: 0 12px 32px rgba(20, 20, 20, 0.14), 0 2px 6px rgba(20, 20, 20, 0.05);
  --tool-bash: #334155;
  --tool-read: #1d4ed8;
  --tool-edit: #b45309;
  --tool-write: #047857;
  --tool-other: #64748b;
  --term-bg: var(--bg-code);
  --term-fg: var(--text-primary);
  --term-cmd: var(--text-primary);
  --term-prompt: color-mix(in srgb, var(--success) 72%, var(--text-primary));
  --term-error: var(--danger);
  --ctx-track: #dbdbdb;
  --ctx-system: #717171;
  --ctx-tools: #7565cc;
  --ctx-rules: #007041;
  --ctx-skills: #a46701;
  --ctx-conversation: #c93714;
  --syntax-fg: #1e293b;
  --syntax-comment: #94a3b8;
  --syntax-string: #16a34a;
  --syntax-number: #ea580c;
  --syntax-keyword: #e11d48;
  --syntax-function: #2563eb;
  --syntax-type: #0284c7;
  --syntax-attr: #b45309;
}


/* ═══ theme:derived ═══ */
/* 由基础色推导的色调;主题块写在它之后,需要时可以单独覆盖。 */
:root,
[data-scheme] {
  --bg-card-blue: color-mix(in srgb, var(--accent-blue) var(--tint), var(--bg-chat));
  --accent-tint: color-mix(in srgb, var(--accent-blue) var(--tint), transparent);
  --accent-tint-strong: color-mix(in srgb, var(--accent-blue) var(--tint-strong), transparent);
  --accent-border: color-mix(in srgb, var(--accent-blue) 32%, transparent);
  --accent-ring: color-mix(in srgb, var(--accent-blue) 14%, transparent);
  --shadow-btn-blue: 0 4px 14px color-mix(in srgb, var(--accent-blue) 35%, transparent);
  --success-tint: color-mix(in srgb, var(--success) var(--tint), transparent);
  --danger-tint: color-mix(in srgb, var(--danger) var(--tint), transparent);
  --warning-tint: color-mix(in srgb, var(--warning) var(--tint), transparent);
  --warning-tint-strong: color-mix(in srgb, var(--warning) var(--tint-strong), transparent);
  --warning-strong: color-mix(in srgb, var(--warning) 62%, var(--text-primary));
  --violet-tint: color-mix(in srgb, var(--violet) var(--tint), transparent);
  --tool-bash-tint: color-mix(in srgb, var(--tool-bash) var(--tint), transparent);
  --tool-read-tint: color-mix(in srgb, var(--tool-read) var(--tint), transparent);
  --tool-edit-tint: color-mix(in srgb, var(--tool-edit) var(--tint), transparent);
  --tool-write-tint: color-mix(in srgb, var(--tool-write) var(--tint), transparent);
  --tool-other-tint: color-mix(in srgb, var(--tool-other) var(--tint), transparent);
  --diff-add-bg: color-mix(in srgb, var(--success) var(--tint), transparent);
  --diff-add-fg: color-mix(in srgb, var(--success) 78%, var(--text-primary));
  --diff-stat-add-fg: color-mix(in srgb, var(--success) 88%, var(--bg-chat));
  --diff-stat-del-fg: color-mix(in srgb, var(--danger) 88%, var(--bg-chat));
  --diff-del-bg: color-mix(in srgb, var(--danger) var(--tint), transparent);
  --diff-del-fg: color-mix(in srgb, var(--danger) 78%, var(--text-primary));
}


/* ═══ reset ═══ */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  border: none;
  outline: none;
}



button,
textarea {
  font: inherit;
  color: inherit;
  background: transparent;
}

button {
  cursor: pointer;
}

/* 重置里去掉了 outline,键盘聚焦时统一补回焦点环;列表行向内收,避免被滚动容器裁掉。 */
:focus-visible {
  outline: 2px solid var(--accent-blue);
  outline-offset: 2px;
}
.input-textarea:focus-visible {
  outline: none;
}

/* ═══ scrollbar ═══ */
::-webkit-scrollbar {
  width: 5px;
  height: 5px;
}
::-webkit-scrollbar-thumb {
  background: var(--scrollbar-thumb);
  border-radius: var(--radius-pill);
}

/* ═══ main-chat-view ═══ */
.main-chat-view {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  position: relative;
  /* 白底交给 ::after 从顶栏下沿铺开,顶栏那一段留给玻璃 */
  background: none;
  --composer-clearance: 220px;
  container-type: inline-size;
  container-name: chat;
}

/* ═══ main-chat-header ═══ */
.main-chat-header {
  height: var(--header-height);
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  /* 顶栏控件抬到玻璃之上,保持清晰,不被模糊 */
  position: relative;
  z-index: 3;
  -webkit-app-region: drag;
  transition: padding-left var(--transition-sidebar);
}


/* ═══ chat-title-group ═══ */
.chat-title-group {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 0;
}

/* ═══ chat-active-title ═══ */
.chat-active-title {
  display: block;
  max-width: 420px;
  font-size: 15px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ═══ chat-title-rename ═══ */
.chat-title-rename {
  display: flex;
  align-items: center;
  gap: 8px;
  text-align: left;
  cursor: pointer;
  border-radius: var(--radius-sm);
  -webkit-app-region: no-drag;
}
.chat-title-rename svg { flex: none; color: var(--text-muted); }
.chat-title-rename > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-title-rename:hover { color: var(--accent-blue); }

/* ═══ chat-flow ═══ */
/* 动画作用在可继承的颜色上,让原生滚动条淡出时保留宽度与拖动命中区。 */
@property --chat-scrollbar-color {
  syntax: "<color>";
  inherits: true;
  initial-value: transparent;
}

.chat-scroll-area {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  /* 自成层叠上下文:卡片内部的定位子元素(如紧凑差异的行文字 z-index: 3)
     不会越过同级、绝对定位的输入框 dock 画到输入框上面。 */
  isolation: isolate;
  /* 底部留白放在滚动内容里而不是 margin:正文才能滑到输入框下方,
     交给输入框上方的渐进模糊接管;滚动到底时最后一条消息依然完整可见。 */
  padding: 20px 24px var(--composer-clearance);
  display: flex;
  align-items: center;
  flex-direction: column;
  gap: 22px;
  --chat-scrollbar-color: transparent;
  transition: --chat-scrollbar-color 180ms ease;
}
.chat-scroll-area.is-scrolling {
  --chat-scrollbar-color: var(--scrollbar-thumb);
  transition-duration: 60ms;
}
.chat-scroll-area::-webkit-scrollbar-thumb { background: var(--chat-scrollbar-color); }
@media (prefers-reduced-motion: reduce) {
  .chat-scroll-area { transition: none; }
}
.chat-scroll-area > .user-msg-container,
.chat-scroll-area > .assistant-block,
.chat-scroll-area > .chat-error-card {
  width: min(100%, 760px);
}
.chat-scroll-area > .empty-state { width: min(100%, 460px); }
.assistant-live-turn {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: calc(min(100%, var(--chat-lane-max, 760px)) - var(--chat-lane-shrink, 0px));
  margin-right: calc(var(--chat-lane-shift, 0px) * 2);
}
.assistant-live-turn > .assistant-block { width: 100%; }

.empty-state {
  margin: auto;
  max-width: 420px;
  text-align: center;
  color: var(--text-secondary);
}
.empty-state h1 {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.03em;
  color: var(--text-primary);
  margin-bottom: 8px;
}
.empty-state p {
  line-height: 1.65;
}
.empty-state-action {
  margin-top: 16px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: var(--radius-pill);
  background: var(--accent-blue);
  color: var(--accent-contrast);
  box-shadow: var(--shadow-btn-blue);
  font-size: 15px;
  font-weight: 600;
}
.empty-state-action:hover { background: var(--accent-blue-hover); }

.chat-error-card {
  background: var(--danger-tint);
  border-radius: var(--radius-lg);
  padding: 14px 18px;
  line-height: 1.65;
  color: var(--text-primary);
  user-select: text;
  overflow-wrap: anywhere;
}
.chat-error-card-title {
  font-weight: 600;
  color: var(--diff-del-fg);
  margin-bottom: 4px;
}

.user-msg-container {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
  min-width: 0;
}
.user-bubble {
  background: var(--bg-chat-bubble-user);
  border-radius: var(--radius-lg);
  padding: 12px 18px;
  max-width: 85%;
  min-width: 0;
  line-height: 1.65;
}
.user-message-actions .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.user-message-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 4px;
  min-height: 24px;
  color: var(--text-muted);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.user-message-actions time { margin-right: 4px; white-space: nowrap; }
.user-message-action { width: 28px; height: 28px; padding: 0; justify-content: center; }
.user-message-editor {
  width: 85%;
  min-width: 0;
  padding: 12px 16px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  background: var(--bg-chat-bubble-user);
}
.user-message-editor textarea {
  display: block;
  width: 100%;
  min-height: 80px;
  padding: 2px;
  resize: vertical;
  border: 0;
  border-radius: var(--radius-xs);
  background: transparent;
  color: var(--text-primary);
  font: inherit;
  line-height: 1.65;
}
.user-message-editor textarea:focus-visible { outline: 2px solid var(--accent-blue); outline-offset: 3px; }
.user-edit-note, .user-edit-error { margin: 10px 0 0; font-size: 12px; line-height: 1.5; }
.user-edit-note { color: var(--text-muted); }
.user-edit-error { color: var(--diff-del-fg); }
.user-edit-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
.user-edit-buttons button { padding: 6px 12px; border-radius: var(--radius-md); font-size: 12px; cursor: pointer; }
.user-edit-cancel { background: transparent; color: var(--text-primary); }
.user-edit-submit { background: var(--text-primary); color: var(--bg-chat); }
.user-edit-buttons button:disabled { opacity: .45; cursor: not-allowed; }
.user-edit-buttons button:focus-visible { outline: 2px solid var(--accent-blue); outline-offset: 2px; }
.user-attachments {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 6px;
  max-width: 85%;
}
/* 缩略图是打开全屏查看的按钮:图片铺满按钮,圆角由按钮裁出。 */
.user-attachment-thumb {
  display: block;
  width: 120px;
  height: 120px;
  max-width: 100%;
  padding: 0;
  overflow: hidden;
  border-radius: var(--radius-md);
  background: var(--bg-surface-subtle);
  cursor: zoom-in;
}
.user-attachment-thumb img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: opacity 140ms ease;
}
.user-attachment-thumb:hover img {
  opacity: 0.88;
}
.user-attachment-thumb:only-child {
  width: 140px;
  height: 140px;
}
.agent-reply-prose {
  min-width: 0;
  color: var(--text-primary);
  font-size: 15px;
  line-height: 1.75;
}
[data-scheme="light"] .agent-reply-prose {
  color: #000;
}

.md-content {
  overflow-wrap: anywhere;
}
.md-content > :first-child {
  margin-top: 0;
}
.md-content > :last-child {
  margin-bottom: 0;
}
.md-content p,
.md-content ul,
.md-content ol,
.md-content blockquote,
.md-content pre,
.md-content .md-table-scroll {
  margin: 0.55em 0;
}
.md-content h1,
.md-content h2,
.md-content h3,
.md-content h4,
.md-content h5,
.md-content h6 {
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.35;
  margin: 0.9em 0 0.35em;
}
/*
 * 标题用 em 跟随所在容器的正文字号:聊天 15px、追踪预览 12px、思考区 13px 都能保持
 * 同一套层级比例,不会在小字号区域里冒出过大的标题。
 */
.md-content h1 { font-size: 1.33em; }
.md-content h2 { font-size: 1.18em; }
.md-content h3 { font-size: 1.07em; }
.md-content h4 { font-size: 1em; }
.md-content h5 { font-size: 0.93em; }
.md-content h6 { font-size: 0.87em; }
.md-content ul,
.md-content ol {
  padding-left: 1.25em;
}
.md-content li {
  margin: 0.18em 0;
}
.md-content li > p {
  margin: 0.15em 0;
}
.md-content a {
  color: var(--accent-blue);
  text-decoration: underline;
  text-underline-offset: 2px;
}
.md-content a:hover {
  color: var(--accent-blue-hover);
}
.md-content blockquote {
  border-left: 2px solid var(--border-strong);
  padding-left: 12px;
  color: var(--text-secondary);
}
.md-content :not(pre) > code {
  font-family: var(--font-mono);
  font-size: 14px;
  background: var(--bg-hover);
  padding: 0.08em 0.35em;
  border-radius: 4px;
  overflow-wrap: normal;
  word-break: normal;
}
.md-content pre {
  background: var(--bg-code);
  border-radius: 10px;
  padding: 12px 14px;
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: 14px;
  line-height: 1.55;
  overflow-wrap: normal;
  word-break: normal;
}
.md-content pre code {
  font-family: inherit;
  font-size: inherit;
  background: none;
  padding: 0;
  white-space: pre;
}
.user-bubble .md-content pre,
.user-bubble .md-content :not(pre) > code {
  background: var(--bg-elevated);
}
.md-content hr {
  height: 1px;
  background: var(--border-subtle);
  margin: 0.9em 0;
}
.md-content del {
  color: var(--text-secondary);
}
.agent-reply-prose .md-content blockquote,
.agent-reply-prose .md-content del {
  color: inherit;
}
.md-table-scroll {
  max-width: 100%;
  overflow-x: auto;
}
.md-content table {
  width: max-content;
  min-width: 100%;
  border-collapse: collapse;
  font-size: 15px;
}
.md-content th,
.md-content td {
  border: 1px solid var(--border-subtle);
  padding: 6px 10px;
  text-align: left;
  vertical-align: top;
}
.md-content th {
  background: var(--bg-surface-subtle);
  font-weight: 600;
}
.md-content img {
  display: block;
  max-width: 100%;
  height: auto;
  border-radius: 8px;
  margin: 0.55em 0;
}
.md-content input[type="checkbox"] {
  appearance: auto;
  margin: 0 0.4em 0 0;
  vertical-align: -0.12em;
}
.md-content li:has(> input[type="checkbox"]) {
  list-style: none;
  margin-left: -1.15em;
}

.assistant-block {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}

/* 回复下方的操作行:复制与分支在左,回复时间贴右。 */
.reply-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  min-height: 22px;
  margin-top: 2px;
}
.reply-action {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 7px;
  border: 0;
  border-radius: var(--radius-xs);
  background: transparent;
  color: var(--text-muted);
  font-size: 12px;
  line-height: 1.4;
  cursor: pointer;
  transition: color var(--transition-enter), background var(--transition-enter);
}
.reply-action:hover:not(:disabled) {
  color: var(--text-primary);
  background: var(--bg-hover);
}
.reply-action:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.reply-action:focus-visible {
  outline: 2px solid var(--accent-blue);
  outline-offset: 1px;
}
.reply-time {
  margin-left: auto;
  padding-left: 8px;
  color: var(--text-muted);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.time-spent-trigger {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--text-muted);
  font-size: 15px;
  font-weight: 500;
  padding: 0;
  border: 0;
  background: transparent;
  text-align: left;
}
.time-spent-trigger.is-running { width: 100%; }
.assistant-turn-trigger {
  width: 100%;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border-subtle);
}
.time-spent-trigger-arrow {
  transition: transform var(--transition-smooth);
}
/* 折叠块会嵌套(思考块位于"查看过程"内部),展开态规则必须只作用于直接子级,
   否则外层展开会把内层折叠体一起强制撑开。 */
.time-spent-collapsible.expanded > .time-spent-trigger .time-spent-trigger-arrow,
.time-spent-collapsible.expanded > .thinking-header > .time-spent-trigger .time-spent-trigger-arrow {

  background: var(--bg-surface-subtle);
}
.compact-diff-card-name {
  min-width: 0;
  flex: 0 1 auto;
  overflow: hidden;
  color: var(--text-primary);
  font-size: 12px;
  font-weight: 550;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.compact-diff-card-stat {
  flex: none;
  display: inline-flex;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.compact-diff-card-copy {
  width: 20px;
  height: 20px;
  flex: none;
  display: grid;
  place-items: center;
  margin-left: auto;
  padding: 0;
  border: 0;
  border-radius: 4px;
  color: var(--text-muted);
  background: transparent;
  cursor: pointer;
}
.compact-diff-card-copy:hover { color: var(--text-primary); }
.compact-diff-card-copy:focus-visible {
  outline: 2px solid var(--accent-blue);
  outline-offset: -2px;
}
.compact-diff-card-note {
  margin: 0;
  padding: 6px 10px;
  border-bottom: 1px solid var(--border-subtle);
  color: var(--text-muted);
  font-size: 12px;
  line-height: 1.5;
}
.thinking-scroll-shell.compact-diff-scroll-shell {
  min-width: 0;
  background: var(--bg-card-surface);
  --scroll-fade-background: var(--bg-card-surface);
}
.compact-diff-scroll-shell .thinking-scroll-viewport .thinking-text {
  padding: 0;
}
.compact-diff-scroll-content { min-width: 0; }
.tool-sheet.tool-sheet-compact-diff {
  border-radius: 0;
  background: var(--bg-card-surface);
  font-size: 12px;
  line-height: 1.65;
}
.tool-sheet-compact-diff .tool-code-line {
  min-height: 22px;
  padding-right: 8px;
}
.tool-sheet-compact-diff .tool-gutter {
  position: relative;
  z-index: 3;
  display: flex;
  align-self: stretch;
  align-items: baseline;
  justify-content: flex-end;
  min-width: 4.5em;
  margin-right: 9px;
  border-right: 1px solid var(--border-subtle);
}
.tool-sheet-compact-diff .tool-code-text { position: relative; z-index: 3; }
.tool-sheet-compact-diff .tool-sign { display: none; }
.tool-sheet-compact-diff .tool-diff-line { position: relative; }
.tool-sheet-compact-diff .tool-diff-line.add::before,
.tool-sheet-compact-diff .tool-diff-line.del::before {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: 3px;
  content: "";
}
.tool-sheet-compact-diff .tool-diff-line.add::before { background: var(--success); }
.tool-sheet-compact-diff .tool-diff-line.del::before { background: var(--danger); }
.tool-sheet-compact-diff .tool-diff-gap.is-compact {
  height: 7px;
  padding: 0;
  border-top: 1px solid var(--border-subtle);
  background: var(--bg-card-surface);
}
.tool-compact-out { margin: 0 8px 4px; }

/* ---------- Browser REPL 调用 ---------- */
.browser-call { min-width: 0; margin: 2px 0; }
.browser-call-head {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-width: 0;
  padding: 3px 0;
  border: none;
  border-radius: 6px;
  background: none;
  font-size: 14px;
  line-height: 1.5;
  color: var(--text-secondary);
  text-align: left;
  cursor: pointer;
}
.browser-call-head:hover { color: var(--text-primary); }
.browser-call-head:focus-visible { outline: 2px solid var(--accent-blue); outline-offset: -2px; }
.browser-call-badge {
  flex: none;
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border-radius: 6px;
  background: color-mix(in srgb, var(--accent-blue) 13%, transparent);
  color: var(--accent-blue);
  transition: background-color 140ms ease;
}
.browser-call.is-running .browser-call-badge { animation: browser-call-pulse 1.4s ease-in-out infinite; }
.browser-call.is-error .browser-call-badge {
  background: color-mix(in srgb, var(--danger) 13%, transparent);
  color: var(--danger);
}
/* 紧凑模式下 Browser REPL 的图标不要底色,尺寸与其他紧凑图标(16px)对齐。 */
.browser-call.is-compact .browser-call-badge,
.browser-call.is-compact.is-error .browser-call-badge {
  width: 16px;
  height: 16px;
  border-radius: 0;
  background: transparent;
}
.browser-call-steps {
  flex: 0 1 auto;
  display: flex;
  align-items: center;
  gap: 4px;
  min-width: 0;
  overflow: hidden;
}
.browser-call-step-wrap {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-width: 0;
  color: var(--text-muted);
}
.browser-call-step {
  min-width: 0;
  max-width: 260px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  padding: 0 7px;
  border-radius: 999px;
  background: var(--bg-surface-subtle);
  box-shadow: inset 0 0 0 1px var(--border-subtle);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
}
.browser-call-shots {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--success-tint);
  color: var(--success);
  font-family: var(--font-mono);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.browser-call.open > .browser-call-head .browser-call-chevron { transform: rotate(90deg); }
.browser-call:not(.is-compact) {
  border-radius: 10px;
  background: var(--bg-surface-subtle);
  padding: 2px 10px;
}
.browser-call:not(.is-compact) .browser-call-step { background: var(--bg-card-surface); }
.browser-call.open > .tool-collapse { grid-template-rows: 1fr; }
.browser-call-body {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 4px 0 8px 28px;
}
.browser-call:not(.is-compact) .browser-call-body { padding-left: 28px; }
.browser-call-code {
  position: relative;
  margin: 0;
  padding: 8px 10px 8px calc(10px + 1.2em);
  border-radius: 8px;
  background: var(--term-bg);
  color: var(--term-fg);
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
}
.browser-call-prompt {
  position: absolute;
  left: 10px;
  color: var(--accent-blue);
  user-select: none;
}
.browser-call-output {
  padding: 0 2px;
  font-size: 13px;
  color: var(--text-secondary);
}
.browser-call-output.failed, .browser-call-output.failed .tool-markdown { color: var(--danger); }
.browser-call-text { margin: 0; }
.browser-call-wait { padding: 0 2px; font-size: 13px; color: var(--text-muted); }
.browser-call-frames { display: flex; flex-wrap: wrap; gap: 10px; }
.browser-call-frame {
  margin: 0;
  width: 240px;
  max-width: 100%;
  overflow: hidden;
  border-radius: 8px;
  background: var(--bg-card-surface);
  box-shadow: 0 0 0 1px var(--border-subtle), 0 2px 8px rgba(0, 0, 0, 0.06);
  transition: width var(--transition-smooth);
}
.browser-call-frame.zoomed { width: 100%; }
.browser-call-chrome {
  display: flex;
  align-items: center;
  gap: 4px;
  height: 22px;
  padding: 0 8px;
  background: var(--bg-surface-subtle);
  border-bottom: 1px solid var(--border-subtle);
}
.browser-call-chrome > span {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--border-subtle);
  box-shadow: inset 0 0 0 1px var(--border-subtle);
}
.browser-call-chrome > em {
  flex: 1;
  min-width: 0;
  margin-left: 6px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--font-mono);
  font-size: 11px;
  font-style: normal;
  color: var(--text-muted);
}
.browser-call-shot {
  display: block;
  width: 100%;
  padding: 0;
  border: none;
  background: none;
  cursor: zoom-in;
}
.browser-call-frame.zoomed .browser-call-shot { cursor: zoom-out; }
.browser-call-shot img { display: block; width: 100%; height: auto; }
@keyframes browser-call-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
@media (prefers-reduced-motion: reduce) {
  .browser-call.is-running .browser-call-badge { animation: none; }
}
.tool-card-list.is-compact .tool-card {
  overflow: visible;
  border-radius: 0;
  background: transparent;
}
.tool-card-list.is-compact .tool-card-head {
  gap: 6px;
  padding: 2px 0;
}
.tool-card-list.is-compact .tool-card-head:hover { background: transparent; }
.tool-card-list.is-compact .tool-card-icon {
  width: 16px;
  height: 16px;
  border-radius: 0;
  background: transparent;
  color: var(--text-muted);
}
.tool-card-list.is-compact .tool-kind-label {
  width: auto;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-muted);
}
.tool-card-list.is-compact .tool-card-name { font-size: 14px; font-weight: 500; }
.tool-card-list.is-compact .tool-card-dir { font-size: 13px; }
.tool-card-list.is-compact .tool-card-body { padding: 2px 0 8px; }

/* 紧凑模式的工具图标配色:设置 → 对话显示 → 工具图标配色,关闭时保持统一灰色。
   Browser REPL 的图标有自己的蓝色底,不在这里处理。 */
:root,
[data-scheme="light"] {
  --tool-icon-bash: #7c5cd6;
  --tool-icon-read: #0f8a8a;
  --tool-icon-edit: #c2710c;
  --tool-icon-write: #1f9d55;
  --tool-icon-group: #5b6fd6;
  --tool-icon-mcp: #d6457a;
  --tool-icon-agent: #b43fc7;
  --tool-icon-ask: #0284c7;
  --tool-icon-other: #e0603c;
  --tool-icon-think: #84a10d;
}
[data-scheme="dark"] {
  --tool-icon-bash: #b9a4f5;
  --tool-icon-read: #5fd0cc;
  --tool-icon-edit: #fbbf6a;
  --tool-icon-write: #6ee7a0;
  --tool-icon-group: #a5b0f5;
  --tool-icon-mcp: #f59ab9;
  --tool-icon-agent: #e19af0;
  --tool-icon-ask: #7dd3fc;
  --tool-icon-other: #fb9b7e;
  --tool-icon-think: #c3e35c;
}
:root[data-tool-icon-color="true"] .tool-compact-icon,
:root[data-tool-icon-color="true"] .tool-card-list.is-compact .tool-card-icon,
:root[data-tool-icon-color="true"] .question-compact-icon {
  color: var(--tool-icon-other);
}
:root[data-tool-icon-color="true"] .tool-kind-bash .tool-compact-icon,
:root[data-tool-icon-color="true"] .tool-card-list.is-compact .tool-kind-bash .tool-card-icon { color: var(--tool-icon-bash); }
:root[data-tool-icon-color="true"] .tool-kind-read .tool-compact-icon,
:root[data-tool-icon-color="true"] .tool-card-list.is-compact .tool-kind-read .tool-card-icon { color: var(--tool-icon-read); }
:root[data-tool-icon-color="true"] .tool-kind-edit .tool-compact-icon,
:root[data-tool-icon-color="true"] .tool-card-list.is-compact .tool-kind-edit .tool-card-icon { color: var(--tool-icon-edit); }
:root[data-tool-icon-color="true"] .tool-kind-write .tool-compact-icon,
:root[data-tool-icon-color="true"] .tool-card-list.is-compact .tool-kind-write .tool-card-icon { color: var(--tool-icon-write); }
:root[data-tool-icon-color="true"] .tool-compact-group.tool-kind-other > .tool-compact-summary .tool-compact-icon { color: var(--tool-icon-group); }
:root[data-tool-icon-color="true"] .tool-card-list.is-compact .tool-card.is-mcp .tool-card-icon { color: var(--tool-icon-mcp); }
:root[data-tool-icon-color="true"] .tool-card-list.is-compact .tool-card.is-task .tool-card-icon,
:root[data-tool-icon-color="true"] .tool-compact-item.agent-compact .tool-compact-icon { color: var(--tool-icon-agent); }
:root[data-tool-icon-color="true"] .question-compact-icon { color: var(--tool-icon-ask); }
.thinking-icon { display: none; }
.main-chat-view[data-tool-display="compact"] .thinking-icon {
  display: grid;
  place-items: center;
  flex: none;
  width: 16px;
  height: 16px;
}
:root[data-tool-icon-color="true"] .thinking-icon { color: var(--tool-icon-think); }
/* 关闭配色时,紧凑模式的 Browser REPL 图标也回到灰色(失败状态由右侧的 ✕ 标出)。 */
:root[data-tool-icon-color="false"] .browser-call.is-compact .browser-call-badge { color: var(--text-muted); }
.tool-collapse {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows var(--transition-smooth);
}
.tool-card.open > .tool-collapse,
.tool-run.open > .tool-collapse,
.tool-compact-group.open > .tool-collapse,
.tool-compact-item.open > .tool-collapse {
  grid-template-rows: 1fr;
}
.tool-collapse-inner {
  min-height: 0;
  overflow: hidden;
}
.tool-card-body { padding: 0 10px 10px; }
.thinking-scroll-shell.tool-details-scroll {
  --scroll-fade-background: var(--bg-surface-subtle);
}
.tool-card-list.is-compact .thinking-scroll-shell.tool-details-scroll,
.tool-compact-item .thinking-scroll-shell.tool-details-scroll {
  --scroll-fade-background: var(--bg-chat);
}

/* ---------- 执行清单（update_plan）展开视图 ---------- */

.plan-checklist {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding: 2px 0 2px 2px;
}
/* 竖向引导线：从第一个图标中心连到最后一个图标中心。 */
.plan-checklist::before {
  content: "";
  position: absolute;
  left: 8px;
  top: 10px;
  bottom: 10px;
  width: 1px;
  background: var(--border-subtle);
}
.plan-checklist-item {
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 13px;
  line-height: 19px;
}
.plan-status-icon {
  display: inline-grid;
  place-items: center;
  flex: none;
}
.plan-status-icon.is-completed { color: var(--success); }
.plan-status-icon.is-in_progress { color: var(--accent-blue); }
.plan-status-icon.is-pending { color: var(--text-muted); }
/* 图标压在引导线上，用卡片底色遮出一段间隔，形成节点效果。 */
.plan-checklist-icon {
  position: relative;
  z-index: 1;
  width: 13px;
  height: 19px;
  background: var(--bg-surface-subtle);
}
.plan-checklist-text {
  min-width: 0;
  overflow-wrap: anywhere;
  color: var(--text-secondary);
}
.plan-checklist-item.is-completed .plan-checklist-text { color: var(--text-muted); }
.plan-checklist-item.is-in_progress .plan-checklist-text { color: var(--text-primary); font-weight: 600; }
.plan-status-inline { vertical-align: -2px; margin-right: 6px; }
.task-steps {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin: 0;
  padding: 2px 2px 0;
  list-style: none;
}
.task-step {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
  font-size: 15px;
  line-height: 1.45;
}
.task-step-name {
  flex: none;
  width: 44px;
  font-weight: 600;
  color: var(--text-muted);
}
.task-step.is-running .task-step-name { color: var(--tool-accent); }
.task-step.is-error .task-step-name { color: var(--danger); }
.task-step-summary {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text-primary);
}
.task-report { margin: 8px 0 0; }
.agent-path {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--font-mono);
  color: var(--text-primary);
}
.agent-kind {
  flex: none;
  padding: 0 5px;
  border-radius: 5px;
  background: var(--bg-surface-subtle);
  color: var(--text-muted);
}
.agent-state { flex: none; color: var(--text-muted); }
.agent-state.is-running { color: var(--tool-accent); }
.agent-state.is-paused { color: var(--warning); }
.agent-state.is-failed { color: var(--danger); }
.agent-state.is-aborted { color: var(--text-muted); opacity: 0.7; }
.agent-status-dot {
  flex: none;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--text-muted);
}
.agent-status-dot.is-idle { opacity: 0.5; }
.agent-status-dot.is-paused { background: var(--warning); }
.agent-status-dot.is-completed { background: var(--success); }
.agent-status-dot.is-failed { background: var(--danger); }
.agent-status-dot.is-aborted { background: var(--text-muted); opacity: 0.55; }
.chat-agents-button {
  display: inline-flex;
  align-items: center;
  flex: none;
  gap: 6px;
  height: 26px;
  padding: 0 9px;
  border-radius: 999px;
  font-size: 13px;
  white-space: nowrap;
  color: var(--text-muted);
  background: var(--bg-surface-subtle);
  cursor: pointer;
  -webkit-app-region: no-drag;
}
.chat-agents-button:hover,
.chat-agents-button.active {
  color: var(--text-primary);
  background: var(--bg-hover);
}
.agent-summary { padding-top: 2px; }
.thinking-scroll-shell.agent-summary-scroll {
  /* 卡片模式下模糊层要盖住卡片底色 */
  --scroll-fade-background: var(--bg-surface-subtle);
  margin-top: 2px;
}
/* 紧凑模式下卡片背景是透明的，模糊层要跟聊天底色一致 */
.agent-compact .thinking-scroll-shell.agent-summary-scroll {
  --scroll-fade-background: var(--bg-chat);
}
.agent-summary-scroll .thinking-scroll-viewport {
  max-height: 320px;
  overflow-x: hidden;
}
.agent-summary-scroll .thinking-scroll-viewport .thinking-text {
  padding: 7px 10px 7px 0;
}
.agent-summary-task { color: var(--text-secondary); }
.agent-summary-report {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border-subtle);
  color: var(--text-primary);
}
.agent-summary-error {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border-subtle);
  color: var(--danger);
}

/* 紧凑模式下的一行：点名称去右侧 Pane，点其他区域开合概况 */
.agent-compact-line {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  min-width: 0;
  padding: 2px 0;
}
.agent-compact-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  border: none;
  background: none;
  padding: 0;
  color: var(--text-muted);
  cursor: pointer;
}
.agent-compact-toggle.is-lead { flex: none; }
/* 箭头紧跟名称，剩余空间仍属于这个开合区域 */
.agent-compact-toggle.is-tail { flex: 1; justify-content: flex-start; }
.agent-compact-line:has(.agent-compact-toggle:hover) .agent-compact-toggle,
.agent-compact-line:has(.agent-compact-toggle:hover) .tool-compact-icon,
.agent-compact-line:has(.agent-compact-toggle:hover) .tool-compact-action,
.agent-compact-line:has(.agent-compact-toggle:hover) .tool-compact-chevron {
  color: var(--text-primary);
}
.agent-compact-name {
  flex: 0 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  padding: 0;
  border: none;
  background: none;
  font-family: var(--font-mono);
  font-size: 14px;
  color: var(--text-primary);
  cursor: pointer;
}
.agent-compact-name:hover { text-decoration: underline; text-underline-offset: 2px; }
.agent-compact-name:disabled { color: var(--text-muted); cursor: default; }
.agent-compact-name:disabled:hover { text-decoration: none; }
.agent-compact-out { margin: 2px 8px 6px; }
.agent-open-hint {
  display: block;
  margin-top: 6px;
  font-size: 13px;
  color: var(--text-muted);
}
.tool-card.is-openable .tool-card-head { cursor: pointer; }


/* ═══ terminal+sheet+keyframes ═══ */
.tool-terminal {
  border-radius: 8px;
  background: var(--term-bg);
  color: var(--term-fg);
  font-family: var(--font-mono);
  font-size: 14px;
  line-height: 1.55;
  overflow: hidden;
}
.tool-terminal-cmd {
  display: flex;
  gap: 8px;
  padding: 8px 10px;
  color: var(--term-cmd);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.tool-terminal-prompt {
  color: var(--term-prompt);
  flex: none;
}
.tool-terminal.failed .tool-terminal-prompt { color: var(--term-error); }
.tool-terminal-out,
.tool-terminal-wait {
  margin: 0;
  padding: 8px 10px 10px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font: inherit;
  color: var(--term-fg);
}
.tool-terminal-cmd + .tool-terminal-out,
.tool-terminal-cmd + .tool-terminal-wait {
  border-top: 1px solid var(--border-subtle);
}
.tool-terminal-wait { color: color-mix(in srgb, var(--term-fg) 62%, transparent); }
.tool-sheet {
  border-radius: 8px;
  background: var(--bg-code);
  overflow: hidden;
  font-family: var(--font-mono);
  font-size: 14px;
  line-height: 1.55;
}
.tool-code-line {
  display: flex;
  align-items: flex-start;
  min-width: 0;
  padding-right: 10px;

  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  box-shadow: var(--shadow-card);
  overflow: hidden;
}
.demo-stage.narrow .main-chat-view { max-width: 520px; }

/* 一次性入场动画:重绘时已出现过的节点不再重放(React 里由协调器保证) */
.no-enter { animation: none !important; }

/* 顶栏:真实应用里是毛玻璃壳 + 拖拽区,这里只保留布局与控件尺寸 */
.demo-stage .main-chat-header { -webkit-app-region: no-drag; border-bottom: 1px solid var(--border-subtle); }
.chat-header-actions { display: flex; align-items: center; gap: 4px; }
.view-icon-btn {
  display: flex; align-items: center; justify-content: center;
  width: 24px; height: 24px; border-radius: var(--radius-xs); color: var(--text-muted);
}
.view-icon-btn:hover { background: var(--bg-sidebar-hover); color: var(--text-primary); }
.chat-project-context { display: inline-flex; align-items: center; gap: 6px; margin-right: 6px; font-size: 13px; color: var(--text-muted); }
.chat-project-branch { padding: 1px 7px; border-radius: var(--radius-pill); background: var(--bg-surface-subtle); }

/* 点阵加载动画:6×6,周期 2s,沿对角线错相。真实实现是 canvas 回放 dot-motion-loader.json。 */
.dot-loader {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  padding: .05em;
  gap: .016em;
  font-size: 16px;
}
.dot-loader i {
  position: relative;
  display: block;
  border-radius: 22%;
  background: color-mix(in srgb, currentColor 12%, transparent);
}
.dot-loader i::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: currentColor;
  animation: dot-wave 2s ease-in-out var(--d, 0s) infinite;
}
@keyframes dot-wave {
  0% { opacity: .5; } 25% { opacity: 0; } 50% { opacity: .5; } 75% { opacity: 1; } 100% { opacity: .5; }
}

.demo-toast {
  position: fixed; left: 50%; bottom: 28px; z-index: 20;
  transform: translate(-50%, 8px); opacity: 0; pointer-events: none;
  padding: 7px 14px; border-radius: var(--radius-pill);
  background: var(--text-primary); color: var(--bg-chat); font-size: 13px;
  transition: opacity .18s ease, transform .18s ease;
}
.demo-toast.show { opacity: 1; transform: translate(-50%, 0); }

/* 标注模式 */
body.annotate .main-chat-view * { cursor: crosshair; }
body.annotate .main-chat-view [class]:hover { outline: 1px dashed var(--accent-blue); outline-offset: 1px; }
.annotate-tip {
  position: fixed; z-index: 30; display: none; pointer-events: none; max-width: 320px;
  padding: 6px 9px; border-radius: 8px; font: 12px/1.45 var(--font-mono);
  background: var(--text-primary); color: var(--bg-chat); box-shadow: var(--shadow-popover);
}
.annotate-tip b { font-weight: 600; word-break: break-all; }
</style>
</head>

<script>
/* Vela 紧凑对话流参考实现 —— 原生 JS,无依赖。
 * 与 apps/desktop/src/renderer 的 React 组件一一对应,函数名沿用原名,方便移植:
 *   ToolList / CompactToolGroup / CompactToolLine / AgentToolCard / GenericToolCard
 *   Thinking / CompletedAssistantTurn / TurnChangesCard / ReplyActions
 *   groupProcessItems / compactSummaryParts / parseDisplayDiff / collapseDiffContext
 */
(() => {
  "use strict";

  /* ───────────────────────── i18n(只覆盖紧凑对话流用到的文案) ───────────────────────── */
  let lang = "zh";
  const tr = (zh, en) => (lang === "zh" ? zh : en);
  const trf = (zh, en, ...args) => (lang === "zh" ? zh : en).replace(/\{(\d+)\}/g, (_, i) => String(args[Number(i)]));

  /* ───────────────────────── DOM 小工具 ───────────────────────── */
  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    for (const [key, value] of Object.entries(props || {})) {
      if (value == null || value === false) continue;
      if (key === "class") el.className = value;
      else if (key === "html") el.innerHTML = value;
      else if (key.startsWith("on")) el.addEventListener(key.slice(2).toLowerCase(), value);
      else if (value === true) el.setAttribute(key, "");
      else el.setAttribute(key, value);
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false) continue;
      el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  /** replaceChildren 会把 null 当成字符串,这里先清掉。 */
  const fill = (el, ...kids) => { el.replaceChildren(...kids.flat(Infinity).filter((k) => k != null && k !== false)); };
  const html = (markup) => {
    const t = document.createElement("template");
    t.innerHTML = markup.trim();
    return t.content.firstChild;
  };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  /* ───────────────────────── 图标(与 components/icons.tsx 同一套路径) ───────────────────────── */
  const icon = (size, inner, cls = "") =>
    `<svg ${cls ? `class="${cls}" ` : ""}width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
  const ICON = {
    terminal: (s = 13) => icon(s, '<rect x="3" y="4" width="18" height="16" rx="2"/><polyline points="7 9 10 12 7 15"/><line x1="12" y1="15" x2="17" y2="15"/>'),
    eye: (s = 13) => icon(s, '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'),
    pencil: (s = 13) => icon(s, '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>'),
    filePlus: (s = 13) => icon(s, '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/>'),
    thinking: (s = 13) => icon(s, '<path d="M9 18h6M10 21.5h4"/><path d="M12 2.5a6.5 6.5 0 0 0-3.7 11.85c.45.32.7.8.7 1.35V16h6v-.3c0-.55.25-1.03.7-1.35A6.5 6.5 0 0 0 12 2.5Z"/>'),
    stack: (s = 13) => icon(s, '<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 12 12 17 22 12"/><polyline points="2 17 12 22 22 17"/>'),
    subagent: (s = 13) => icon(s, '<rect x="8.5" y="3" width="7" height="7" rx="1.8"/><rect x="3" y="14" width="7" height="7" rx="1.8"/><rect x="14" y="14" width="7" height="7" rx="1.8"/><path d="M12 10v2"/><path d="M6.5 14v-2h11v2"/>'),
    tool: (s = 13) => icon(s, '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76Z"/>'),
    copy: (s = 13) => icon(s, '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'),
    check: (s = 13) => icon(s, '<polyline points="20 6 9 17 4 12"/>'),
    branch: (s = 13) => icon(s, '<line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>'),
    history: (s = 13) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.64-6.36L3 8.3"/><path d="M3 3.5v4.8h4.8"/><path d="M12 7.5V12l3 2"/></svg>`,
    arrowDown: (s = 11) => icon(s, '<line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/>'),
    send: (s = 15) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>`,
    plus: (s = 14) => icon(s, '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'),
    circle: (s = 11) => icon(s, '<circle cx="12" cy="12" r="9"/>'),
    arrowRight: (s = 11) => icon(s, '<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>'),
    x: (s = 11) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
    chevronDown: (s = 13, cls = "") => icon(s, '<path d="m6 9 6 6 6-6"/>', cls),
    pencilTitle: (s = 13) => icon(s, '<path d="m16 3 5 5-12 12-6 1 1-6L16 3Z"/><path d="m14 5 5 5"/>'),
    fileChange: () => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="2.5" width="18" height="19" rx="3"/><path d="M8 8h8M8 16h8M12 5v6"/></svg>`,
    undo: () => `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-2"/></svg>`,
    panel: () => `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="16" y1="3" x2="16" y2="21"/></svg>`,
  };
  /** 展开箭头:12px、2.5 描边,朝右,展开后 CSS 转 90°。 */
  const chevron = (cls) => icon(12, '<polyline points="9 18 15 12 9 6"/>', cls).replace('stroke-width="2"', 'stroke-width="2.5"');
  const iconEl = (markup) => html(markup);

  /** 点阵加载动画:6×6,沿对角线的相位差,周期 2s。真实实现是 canvas 回放 dot-motion-loader.json。 */
  function ActivityIndicator(label) {
    const el = h("span", { class: "tool-activity-loader dot-loader", role: "status", "aria-label": label || tr("运行中", "Running") });
    for (let r = 0; r < 6; r += 1) {
      for (let c = 0; c < 6; c += 1) {
        const shift = ((r + c) * 0.14) % 1;
        el.append(h("i", { style: `--d:${((shift - 1) * 2).toFixed(3)}s` }));
      }
    }
    return el;
  }

  /* ───────────────────────── 纯函数:与 tool-compact.ts / tool-sequence.ts / ToolCard.tsx 对应 ───────────────────────── */
  const FOLDABLE = new Set(["bash", "read", "edit", "write"]);
  const toolKind = (name) => (name === "browser_repl" || name === "browser_repl_reset" ? "browser" : FOLDABLE.has(name) ? name : "other");
  const compactKind = (name) => (FOLDABLE.has(name) ? name : null);
  const shouldFoldRun = (length, display) => (display === "compact" ? length > 1 : length >= 3);
  const isAgentTool = (name) => name === "task";

  function splitPath(path) {
    const n = path.replaceAll("\\", "/");
    const i = n.lastIndexOf("/");
    if (i <= 0) return { name: path, dir: "" };
    return { name: n.slice(i + 1), dir: n.slice(0, i) };
  }

  function diffStat(diff) {
    if (!diff) return null;
    let added = 0;
    let removed = 0;
    for (const line of diff.split("\n")) {
      if (line.startsWith("+") && !line.startsWith("+++")) added += 1;
      else if (line.startsWith("-") && !line.startsWith("---")) removed += 1;
    }
    return added || removed ? { added, removed } : null;
  }
  function totalDiffStat(tools) {
    let added = 0;
    let removed = 0;
    for (const tool of tools) {
      const s = diffStat(tool.activity && tool.activity.diff);
      if (s) { added += s.added; removed += s.removed; }
    }
    return added || removed ? { added, removed } : null;
  }

  /** 按首次出现顺序聚合种类;同一文件的同类操作只计一次(bash 每条都计)。 */
  function compactSummaryParts(tools) {
    const order = [];
    const counts = new Map();
    const seen = new Set();
    for (const tool of tools) {
      const kind = compactKind(tool.name);
      if (!kind) continue;
      if (kind !== "bash") {
        const path = tool.activity && tool.activity.path ? tool.activity.path.trim().replaceAll("\\", "/") : "";
        if (path) {
          const key = `${kind}:${path}`;
          if (seen.has(key)) continue;
          seen.add(key);
        }
      }
      if (!counts.has(kind)) order.push(kind);
      counts.set(kind, (counts.get(kind) || 0) + 1);
    }
    return order.map((kind) => ({ kind, count: counts.get(kind) || 0 }));
  }

  /** 展示 diff 的一行形如 `+ 12 text`;`...` 是省略的上下文。 */
  function parseDisplayDiff(diff) {
    const rows = [];
    const re = /^([+\- ]) *(\d+) (.*)$/;
    const lines = diff.split("\n");
    if (lines[lines.length - 1] === "") lines.pop();
    for (const line of lines) {
      if (line.trim() === "..." || line.trim() === "…") { rows.push({ kind: "gap", gutter: "", text: "…" }); continue; }
      const m = re.exec(line);
      if (m) rows.push({ kind: m[1] === "+" ? "add" : m[1] === "-" ? "del" : "ctx", gutter: m[2], text: m[3] || "" });
      else if (line.startsWith("+")) rows.push({ kind: "add", gutter: "", text: line.slice(1) });
      else if (line.startsWith("-")) rows.push({ kind: "del", gutter: "", text: line.slice(1) });
      else rows.push({ kind: "ctx", gutter: "", text: line.trim() ? line.slice(1) : "" });
    }
    return rows;
  }

  /** 紧凑 diff:两处改动之间超过 3 行的未改内容只留首尾各一行,中间换成 7px 细分隔带。 */
  function collapseDiffContext(rows) {
    const out = [];
    const changedAfter = new Array(rows.length + 1).fill(false);
    for (let i = rows.length - 1; i >= 0; i -= 1) changedAfter[i] = changedAfter[i + 1] || rows[i].kind === "add" || rows[i].kind === "del";
    let i = 0;
    let changeBefore = false;
    while (i < rows.length) {
      const row = rows[i];
      if (row.kind !== "ctx") {
        out.push(row);
        if (row.kind === "add" || row.kind === "del") changeBefore = true;
        i += 1;
        continue;
      }
      const start = i;
      while (i < rows.length && rows[i].kind === "ctx") i += 1;
      const ctx = rows.slice(start, i);
      if (ctx.length > 3 && changeBefore && changedAfter[i]) out.push(ctx[0], { kind: "gap", gutter: "", text: "" }, ctx[ctx.length - 1]);
      else out.push(...ctx);
    }
    return out;
  }

  function subjectOf(kind, activity, name) {
    if (kind === "bash") {
      const command = (activity.command || "").replace(/\s+/g, " ").trim();
      return { name: command || tr("命令", "Command"), dir: "" };
    }
    const path = (activity.path || "").trim();
    if (!path) {
      if (name === "update_plan" && activity.plan && activity.plan.length) return { name: activity.plan[0].text, dir: "" };
      return { name, dir: "" };
    }
    const n = path.replaceAll("\\", "/");
    if (n.lastIndexOf("/") <= 0) return { name: path, dir: "" };
    return splitPath(path);
  }

  const compactAction = (kind) => (kind === "write" ? tr("已创建", "Created") : kind === "edit" ? tr("已编辑", "Edited") : kind === "read" ? tr("已读取", "Read") : tr("已运行", "Ran"));
  function compactPartLabel({ kind, count }) {
    if (kind === "edit") return trf("已编辑 {0} 个文件", count === 1 ? "Edited {0} file" : "Edited {0} files", count);
    if (kind === "write") return trf("已创建 {0} 个文件", count === 1 ? "Created {0} file" : "Created {0} files", count);
    if (kind === "read") return trf("已读取 {0} 个文件", count === 1 ? "Read {0} file" : "Read {0} files", count);
    return trf("已运行 {0} 条命令", count === 1 ? "Ran {0} command" : "Ran {0} commands", count);
  }
  const toolLabel = (name, kind) => {

  function formatDuration(ms) {

    if (hh > 0) return trf("{0}小时{1}分{2}秒", "{0}h {1}m {2}s", hh, mm, ss);

  /** 按连续的可折叠工具切段;非折叠类工具自成一段。 */

  /** toolFold = "position":整轮拍平后按位置合并相邻工具,思考/正文/交互卡片都会打断。 */

  /* ───────────────────────── Markdown(演示用的极简实现) ───────────────────────── */
  function inline(text) {
    let s = esc(text);
    s = s.replace(/`([^`]+)`/g, (_, c) => (/\.(ts|tsx|js|json|md|css)$|\//.test(c) ? `<code class="code-file-ref">${c}</code>` : `<code>${c}</code>`));
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");

  }
  function markdown(text, opts = {}) {
    const root = h("div", { class: "md-content" });
    const blocks = [];
    const lines = text.replace(/\r/g, "").split("\n");
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      if (!line.trim()) { i += 1; continue; }
      if (line.startsWith("```")) {
        const body = [];
        i += 1;
        while (i < lines.length && !lines[i].startsWith("```")) { body.push(lines[i]); i += 1; }
        i += 1;
        blocks.push(`<pre><code>${highlight(body.join("\n"))}</code></pre>`);
      } else if (/^#{1,6} /.test(line)) {
        const level = line.match(/^#+/)[0].length;
        blocks.push(`<h${level}>${inline(line.replace(/^#+ /, ""))}</h${level}>`);
        i += 1;
      } else if (/^\s*[-*] /.test(line) || /^\s*\d+\. /.test(line)) {
        const ordered = /^\s*\d+\. /.test(line);
        const items = [];
        while (i < lines.length && (ordered ? /^\s*\d+\. /.test(lines[i]) : /^\s*[-*] /.test(lines[i]))) {
          items.push(`<li>${inline(lines[i].replace(/^\s*(?:[-*]|\d+\.) /, ""))}</li>`);
          i += 1;
        }
        blocks.push(`<${ordered ? "ol" : "ul"}>${items.join("")}</${ordered ? "ol" : "ul"}>`);
      } else if (line.startsWith("|")) {
        const rows = [];
        while (i < lines.length && lines[i].startsWith("|")) { rows.push(lines[i]); i += 1; }
        const cells = (r) => r.split("|").slice(1, -1).map((c) => c.trim());
        const head = cells(rows[0]);
        const body = rows.slice(2).map(cells);
        blocks.push(`<div class="md-table-scroll"><table><thead><tr>${head.map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${body.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      } else {
        const para = [];
        while (i < lines.length && lines[i].trim() && !/^(```|#{1,6} |\s*[-*] |\s*\d+\. |\|)/.test(lines[i])) { para.push(lines[i]); i += 1; }
        blocks.push(`<p>${inline(para.join(" "))}</p>`);
      }
    }
    const block = h("div", { class: `md-block${opts.entering ? " is-entering" : ""}`, html: blocks.join("") });
    root.append(block);
    return root;
  }

  /** 极简 TS 高亮:颜色取 --syntax-*,对应真实应用里 shiki 分词后写进 style 的 color。 */
  function highlight(code) {
    const re = /(\/\/.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`(?:[^`\\]|\\.)*`)|\b(const|let|var|export|function|return|await|async|import|from|if|else|throw|new|type|interface|extends|for|of|while|catch|try|default|as)\b|\b(\d+(?:\.\d+)?)\b|\b([A-Z][A-Za-z0-9]*)\b|\b([a-zA-Z_$][\w$]*)(?=\()/gm;
    let out = "";
    let last = 0;
    for (let m = re.exec(code); m; m = re.exec(code)) {
      out += esc(code.slice(last, m.index));
      const cls = m[1] ? "comment" : m[2] ? "string" : m[3] ? "keyword" : m[4] ? "number" : m[5] ? "type" : "function";
      out += `<span style="color:var(--syntax-${cls})">${esc(m[0])}</span>`;
      last = m.index + m[0].length;

    return out + esc(code.slice(last));
  }

  /** 0fr→1fr 网格折叠。子内容首次展开时才创建(LazyMount),之后保留。 */

  /** 限高滚动容器:上下边缘渐隐,强度随距边缘的距离平滑变化(thinking-edges.ts)。 */
  function thinkingEdges(scrollTop, scrollHeight, clientHeight) {
    const max = Math.max(0, scrollHeight - clientHeight);
    const pos = Math.max(0, Math.min(scrollTop, max));

  function ScrollFade(className, contentClass, child, onReady) {

    const top = h("div", { class: "thinking-scroll-fade thinking-scroll-fade-top", "aria-hidden": "true", style: "opacity:0" });
    const bottom = h("div", { class: "thinking-scroll-fade thinking-scroll-fade-bottom", "aria-hidden": "true", style: "opacity:0" });

  /* ───────────────────────── CompactToolLine:单行(文件类 / bash) ───────────────────────── */
  function CompactToolLine(tool, { hideAction = false, hideIcon = false } = {}) {

  /* ───────────────────────── CompactToolGroup:一段连续工具折成一行摘要 ───────────────────────── */
  function CompactToolGroup(tools, sequenceId) {

        h("span", { class: "tool-compact-icon", "aria-hidden": "true", html: uniform ? { bash: ICON.terminal, read: ICON.eye, edit: ICON.pencil, write: ICON.filePlus }[uniform]() : ICON.stack() }),

  function AssistantMessageContent(message, { active, showText = true }) {

  /** toolFold = "position":整轮拍平后,思考 / 正文打断工具分组,相邻工具合并成一段。 */
  function ToolSequence(messages, { includeText, activeId }) {
    const nodes = groupProcessItems(buildTurnItems(messages, includeText), "compact");
    const byId = new Map(messages.map((m) => [m.id, m]));
    const out = [];
    let buffer = [];
    const flush = () => {
      if (!buffer.length) return;
      out.push(h("div", { class: "tool-card-list is-compact" }, buffer.map((n) =>
        n.type === "run" ? CompactToolGroup(n.tools, n.id)
          : compactKind(n.tool.name) ? CompactToolLine(n.tool) : ToolCard(n.tool))));
      buffer = [];
    };
    for (const node of nodes) {
      if (node.type === "tool" || node.type === "run") { buffer.push(node); continue; }
      flush();
      if (node.type === "thinking") {
        const m = byId.get(node.messageId);
        out.push(Thinking({ id: node.messageId, text: node.text, active: node.messageId === activeId && m && !m.text && m.tools.length === 0 }));
      } else out.push(Prose(node.text, node.messageId === activeId));
    }
    flush();
    return out;
  }

  function CompletedAssistantTurn(turn) {
    const msgs = turn.assistants;
    const finalReply = [...msgs].reverse().find((m) => m.text.trim());
    const key = foldSeq(`turn:${msgs[0].id}`);
    let expanded = isOpen(key);
    const started = msgs[0].turnStartedAt;
    const completed = msgs[msgs.length - 1].turnCompletedAt;
    const allTools = msgs.flatMap((m) => m.tools);
    const total = prefs.details ? toolsDuration(allTools) : null;
    const elapsed = formatElapsed(total != null ? total : completed - started);
    const hasProcess = true;
    const article = h("article", { class: `assistant-block assistant-turn${seen.has(msgs[0].id) ? "" : " message-enter"}` });
    const wrap = h("div", { class: `time-spent-collapsible${expanded ? " expanded" : ""}` });

      }

    const sync = () => {
      wrap.classList.toggle("expanded", expanded);
      trigger.setAttribute("aria-expanded", String(expanded));
      body.setAttribute("aria-hidden", String(!expanded));
      if (expanded) { body.removeAttribute("inert"); mount(); } else body.setAttribute("inert", "");
    };
    trigger.addEventListener("click", () => { expanded = !expanded; fold.set(key, expanded); sync(); });
    wrap.append(trigger, body);
    sync();
    article.append(wrap, Prose(finalReply.text, false), ReplyActions({ text: finalReply.text, timestamp: completed }));
    if (turn.changes) article.append(TurnChangesCard(turn.changes));
    return article;

            { id: "t14", name: "task", status: "done", durationMs: 12800, activity: { agent: "explore", agentPath: "/root/regression-scan", agentStatus: "completed",
              task: tr("检查是否还有遗漏的 `retryOnce` 调用。", "Check for any remaining `retryOnce` calls."),
              report: tr("全仓库已无 `retryOnce` 引用；`withRetry` 共 3 处调用，签名一致。", "No `retryOnce` references remain; `withRetry` has 3 call sites with consistent signatures.") } },
            { id: "t15", name: "read", status: "done", durationMs: 60, activity: { path: "apps/desktop/src/main/retry-policy.ts", body: "…" } },
          ],
          turnCompletedAt: T0 + 38000,
          text: D([
            tr("**重试逻辑已抽出。** 新模块 `apps/desktop/src/main/retry-policy.ts` 只负责重试策略，调用点都已替换。", "**The retry logic is extracted.** The new module `apps/desktop/src/main/retry-policy.ts` only owns the retry policy, and every call site is updated."),
            "",
            tr("- 策略：默认 3 次，指数退避，`TypeError` 不重试", "- Policy: 3 attempts by default, exponential backoff, `TypeError` is not retried"),
            tr("- 调用点：`session-host.ts`、`runtime.ts` 已迁移", "- Call sites: `session-host.ts` and `runtime.ts` are migrated"),
            tr("- 测试：`retry-policy.test.ts` 通过", "- Tests: `retry-policy.test.ts` passes"),
            "",
            "```ts",
            "export const defaultPolicy: RetryPolicy = {",
            "  attempts: 3,",
            "  delayMs: (attempt) => 200 * 2 ** attempt,",
            "};",
            "```",
            "",
            tr("| 文件 | 改动 |", "| File | Change |"),
            "| --- | --- |",
            tr("| `retry-policy.ts` | 新增 |", "| `retry-policy.ts` | New |"),
            tr("| `session-host.ts` | 改用 `withRetry` |", "| `session-host.ts` | Uses `withRetry` |"),
          ]),
        },
      ],
      changes: { added: 28, removed: 4, files: [
        { path: "apps/desktop/src/main/retry-policy.ts", added: 11, removed: 0 },
        { path: "apps/desktop/src/main/session-host.ts", added: 2, removed: 2 },
        { path: "apps/desktop/test/retry-policy.test.ts", added: 8, removed: 0 },
        { path: "packages/agent/src/runtime.ts", added: 1, removed: 1 },
        { path: "apps/desktop/src/main/index.ts", added: 1, removed: 0 },
        { path: "packages/agent/src/index.ts", added: 1, removed: 0 },
      ] },
    },
  ];

  /** 演示「流式」的第二轮:每一步追加数据后重绘。 */
  function liveScript() {
    const now = Date.now();
    const user = { id: "u2", text: tr("再把默认策略的单测补全:不可重试的错误应该立刻抛出。", "Also add tests for the default policy: non-retryable errors should be thrown immediately."), timestamp: now };
    const a1 = { id: "b1", turnStartedAt: now, thinking: "", tools: [], text: "" };
    const a2 = { id: "b2", thinking: "", tools: [], text: "" };
    const steps = [
      [0, (c) => { c.user = user; c.assistants = [a1]; }],
      [500, () => { a1.thinking = tr("需要补两个用例:", "Two cases to add:"); }],
      [800, () => { a1.thinking += tr("\n\n1. `TypeError` 不重试，直接抛出。\n2. 其余错误按退避重试到上限。", "\n\n1. `TypeError` is not retried and is thrown right away.\n2. Other errors are retried with backoff up to the limit."); }],
      [1000, () => { a1.tools.push({ id: "n1", name: "read", status: "running", activity: { path: "apps/desktop/test/retry-policy.test.ts" } }); }],
      [900, () => { Object.assign(a1.tools[0], { status: "done", durationMs: 90 }); a1.tools.push({ id: "n2", name: "read", status: "running", activity: { path: "apps/desktop/src/main/retry-policy.ts" } }); }],
      [900, () => { Object.assign(a1.tools[1], { status: "done", durationMs: 70 }); }],
      [600, (c) => { c.assistants.push(a2); a2.tools.push({ id: "n3", name: "edit", status: "running", activity: { path: "apps/desktop/test/retry-policy.test.ts", diff: D(["   7     expect(defaultPolicy.delayMs(2)).toBe(800);", "   8   });", "+  9   it(\"does not retry TypeError\", () => {", "+ 10     expect(defaultPolicy.retryable(new TypeError())).toBe(false);", "+ 11   });"]) } }); }],
      [1400, () => { Object.assign(a2.tools[0], { status: "done", durationMs: 140 }); a2.tools.push({ id: "n4", name: "bash", status: "running", activity: { command: "pnpm --filter @vela/desktop test retry-policy" } }); }],
      [1800, () => { Object.assign(a2.tools[1], { status: "done", durationMs: 3600, activity: { command: "pnpm --filter @vela/desktop test retry-policy", body: D(["✓ test/retry-policy.test.ts (2)", "", "Test Files  1 passed (1)", "     Tests  2 passed (2)"]) } }); }],
      [700, () => { a2.text = tr("新增 `TypeError` 用例，2 个测试全部通过。", "Added the `TypeError` case; both tests pass."); }],
      [900, () => { a2.turnCompletedAt = Date.now(); }],
    ];
    return { steps, chat: { id: "turn-2", user: null, assistants: [], changes: { added: 3, removed: 0, files: [{ path: "apps/desktop/test/retry-policy.test.ts", added: 3, removed: 0 }] } } };
  }

  /* ───────────────────────── 页面骨架与渲染循环 ───────────────────────── */
  const surface = document.getElementById("surface");
  const scroller = document.getElementById("scroller");
  const jump = document.getElementById("jump");
  let turns = DATA();
  let liveTurn = null; // { chat, running }
  let pinned = true;
  let timers = [];

  function render() {
    const prevScroll = scroller.scrollTop;
    seen = new Set(seen);
    const nodes = [];
    const all = liveTurn ? [...turns, liveTurn.chat] : turns;
    all.forEach((turn, index) => {
      if (turn.user) nodes.push(UserMessage(turn.user));
      if (!turn.assistants.length) return;
      const isLive = liveTurn && turn === liveTurn.chat && liveTurn.running;
      if (!isLive) nodes.push(CompletedAssistantTurn(turn));
      else {
        const last = turn.assistants[turn.assistants.length - 1];
        nodes.push(LiveAssistantTurn(turn, last.id, turn.assistants[0].turnStartedAt));
      }
    });
    surface.replaceChildren(...nodes);
    // 记住已展示过的节点,下一次重绘不再重放入场动画
    for (const turn of all) {
      if (turn.user) seen.add(turn.user.id);
      for (const m of turn.assistants) { seen.add(m.id); for (const t of m.tools) seen.add(t.id); }
    }
    if (pinned) scroller.scrollTop = scroller.scrollHeight; else scroller.scrollTop = prevScroll;
    syncJump();
  }

  const syncJump = () => {
    const distance = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight;
    jump.dataset.visible = distance > 120 ? "true" : "false";
  };
  scroller.addEventListener("scroll", () => {
    const distance = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight;
    pinned = distance < 80;
    syncJump();
    scroller.classList.add("is-scrolling");
    clearTimeout(scroller._t);
    scroller._t = setTimeout(() => scroller.classList.remove("is-scrolling"), 800);
  }, { passive: true });
  jump.addEventListener("click", () => { pinned = true; scroller.scrollTop = scroller.scrollHeight; });

  // 输入框高度 → 滚动区底部留白(--composer-clearance)
  const dock = document.querySelector(".chat-dock-wrapper");
  new ResizeObserver(() => {
    const height = dock.getBoundingClientRect().height;
    if (height > 0) document.querySelector(".main-chat-view").style.setProperty("--composer-clearance", `${Math.ceil(height + 36)}px`);
  }).observe(dock);

  // 「已处理 xx」每秒刷新
  setInterval(() => {
    document.querySelectorAll(".live-elapsed").forEach((el) => {
      el.textContent = trf("已处理 {0}", "Worked {0}", formatElapsed(Date.now() - Number(el.dataset.started)));
    });
  }, 1000);

  /* ───────────────────────── 输入框(静态外观 + 发送/停止切换) ───────────────────────── */
  const slot = document.querySelector(".composer-action-slot");
  function setStreaming(on) { slot.classList.toggle("is-streaming", on); slot.querySelector(".stop").inert = !on; }

  function replay() {
    timers.forEach(clearTimeout);
    timers = [];
    const { steps, chat } = liveScript();
    liveTurn = { chat, running: true };
    setStreaming(true);
    pinned = true;
    let at = 0;
    steps.forEach(([delay, apply], index) => {
      at += delay;
      timers.push(setTimeout(() => {
        apply(chat);
        if (index === steps.length - 1) { liveTurn.running = false; setStreaming(false); }
        render();
      }, at));
    });
  }
  document.querySelector(".stop").addEventListener("click", () => { timers.forEach(clearTimeout); if (liveTurn) { liveTurn.running = false; const last = liveTurn.chat.assistants.at(-1); if (last) { last.tools.forEach((t) => t.status === "running" && (t.status = "error")); last.text = last.text || tr("（已停止）", "(stopped)"); last.turnCompletedAt = Date.now(); } } setStreaming(false); render(); });

  /* ───────────────────────── 控制条 ───────────────────────── */
  const $ = (id) => document.getElementById(id);
  $("fold").addEventListener("change", (e) => { prefs.toolFold = e.target.value; render(); });
  $("details").addEventListener("change", (e) => { prefs.details = e.target.checked; render(); });
  $("iconColor").addEventListener("change", (e) => { prefs.iconColor = e.target.checked; document.documentElement.dataset.toolIconColor = String(prefs.iconColor); });
  $("narrow").addEventListener("change", (e) => document.getElementById("stage").classList.toggle("narrow", e.target.checked));
  $("annotate").addEventListener("change", (e) => document.body.classList.toggle("annotate", e.target.checked));
  $("lang").addEventListener("change", (e) => { lang = e.target.value; document.documentElement.lang = lang === "zh" ? "zh-CN" : "en"; chrome(); const wasLive = liveTurn; turns = DATA(); if (wasLive) liveTurn = null; render(); });
  $("replay").addEventListener("click", replay);
  $("expand").addEventListener("click", () => {
    const ids = [];
    turns.forEach((t) => { ids.push(foldSeq(`turn:${t.assistants[0].id}`)); t.assistants.forEach((m) => { ids.push(foldRow(`thinking:${m.id}`)); m.tools.forEach((tool) => ids.push(foldRow(tool.id))); splitToolRuns(m.tools).forEach((s) => ids.push(foldSeq(s[0].id))); }); });
    buildTurnItems(turns.flatMap((t) => t.assistants)).forEach((i) => i.kind === "tool" && ids.push(foldSeq(i.id)));
    ids.forEach((id) => fold.set(id, true));
    render();
  });
  $("collapse").addEventListener("click", () => { for (const k of [...fold.keys()]) fold.set(k, false); render(); });

  function chrome() {
    document.querySelectorAll("[data-zh]").forEach((el) => (el.textContent = lang === "zh" ? el.dataset.zh : el.dataset.en));
    document.querySelector(".input-textarea").placeholder = tr("随心输入", "Ask anything or describe a task");
    document.querySelector(".chat-active-title span").textContent = tr("抽取重试逻辑", "Extract retry logic");
  }

  /* ───────────────────────── 标注模式:悬停显示 class 与关键样式 ───────────────────────── */
  const tip = h("div", { class: "annotate-tip" });
  document.body.append(tip);
  document.addEventListener("mousemove", (e) => {
    if (!document.body.classList.contains("annotate")) { tip.style.display = "none"; return; }
    const el = e.target.closest(".main-chat-view *");
    if (!el || !el.classList.length) { tip.style.display = "none"; return; }
    const cs = getComputedStyle(el);
    tip.innerHTML = `<b>.${[...el.classList].join(" .")}</b><br>${cs.fontSize} / ${cs.fontWeight} · color ${cs.color}${cs.backgroundColor !== "rgba(0, 0, 0, 0)" ? `<br>bg ${cs.backgroundColor}` : ""}<br>gap ${cs.gap} · padding ${cs.padding}`;
    tip.style.display = "block";
    tip.style.left = `${Math.min(e.clientX + 14, innerWidth - 320)}px`;
    tip.style.top = `${Math.min(e.clientY + 14, innerHeight - 90)}px`;
  });

  // 首屏:第一轮已完成并展开过程,方便直接看到紧凑样式
  fold.set(foldSeq("turn:a1"), true);
  fold.set(foldSeq("t1"), true); // 第一组读取+命令:展开
  fold.set(foldSeq("t5"), true); // 创建/编辑组:展开
  fold.set(foldRow("t6"), true); // 一条 diff 预览
  fold.set(foldSeq("t11"), true); // 两条命令的分组:展开
  fold.set(foldRow("t11"), true); // 失败命令的输出
  chrome();
  pinned = false; // 首屏停在顶部,先看第一轮的紧凑工具行
  render();
  scroller.scrollTop = 0;
})();

</script>
</body>
</html>
